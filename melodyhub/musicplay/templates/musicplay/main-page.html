{% extends "musicplay/base.html" %}

{% block content %}
<div class="page-title">
    <h1>Welcome to MelodyHub</h1>
</div>
<div class="container">
    <div id="search-section">
        <div class="search-container">
            <input type="text" name="q" class="search-bar" id="search-input" placeholder="Search Music...">
        </div>
        <div class="music-list" id="search-results"></div>
    </div>


</div>
<div class="play-status-bar" id="play-status-bar">
    <p>Now Playing: <span id="currentSong">Song Name - Artist</span></p>
    <audio id="audio-player" controls style="display: none;"></audio>

    <div class="custom-controls" id="custom-controls">
        <img id="music-cover" src="" alt="Music cover">
        <button id="play-pause-button" class="play"></button>
        <input id="progress-bar" type="range" min="0" max="100" value="0">
        <div id="music-time"><span id="current-time">00:00</span> / <span id="total-time">00:00</span></div>
        <div id="volume-icon" class="volume-on">🔊</div>
        <input id="volume-control" type="range" min="0" max="1" step="0.01" value="1">
    </div>
</div>

{% load static %}
<script src="{% static 'musicplay/js/play_status_bar.js' %}"></script>
<script src="{% static 'musicplay/js/search_ajax.js' %}"></script>

{% endblock %}
