<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    {% load static %}
    <link href="{% static 'musicplay/base.css' %}" rel="stylesheet" type="text/css">
    <link href="{% static 'ListenTogether/css/base.css' %}" rel="stylesheet" type="text/css">
    <link rel="icon" href="{% static 'images/tab_icon.jpg' %}" type="image/x-icon">

    <title> {% block title %} MelodyHub {% endblock %} </title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body>
    <br>
    <div style="font-family:Comfortaa,cursive; display: flex; justify-content: center;">
        <h1>{{ request.session.title }}</h1>
    </div>
    {% if user.is_authenticated %}
    <div class="user-info">
        {% block user-info %}
        <div class="dropdown">
            <img style="border-radius: 50%; height: 2em;" src="{{ request.session.picture }}"
                alt="User profile picture"><br>
            <div class="dropdown-content">
                {{user.username}} <br>
                <a href="{% url 'musicplay:my_profile' %}">My Profile</a> <br>
                <a href="{% url 'musicplay:logout' %}">Logout</a>
            </div>
        </div>
        <a href="{% url 'musicplay:home' %}">Home</a>
        {% endblock %}
    </div>
    {% endif %}

    <!-- {% if message %}
    <div class="message">
        {{message}}
    </div>
    {% endif %} -->

    {% block content %}
    {% endblock %}
</body>

</html>
