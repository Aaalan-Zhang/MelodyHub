<!doctype html>
<html>
	<head>
	    <meta charset="utf-8">
	    {% load static %}
		<link href="{% static 'musicplay/base.css' %}" rel="stylesheet" type="text/css">
		<title> {% block title %} MelodyHub {% endblock %} </title>
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
	</head>

	<body>
		<div class="big-heading">
            {{ request.session.title }}
		</div>

	    <div class="user-info">
			{% block user-info %}
			{% endblock %}
	    </div>

	    <!-- <div class="search-bar">
			{% block search-bar %}
			{% endblock %}
		</div> -->

	    {% if message %}
	        <div class="message">
	            {{message}}
	        </div>
	    {% endif %}

	    <div class="content">
		    {% block content %}
		    {% endblock %}
		</div>
	</body>
</html>
